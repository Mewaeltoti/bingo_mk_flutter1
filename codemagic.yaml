
workflows:
  flutter-android-apk:
    name: Bingo Ethio

    environment:
      flutter: stable
      java: 17

    triggering:
      events:
        - push

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

   
