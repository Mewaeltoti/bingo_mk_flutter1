name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy claim-bingo
        run: supabase functions deploy claim-bingo --project-ref $PROJECT_ID

      - name: Deploy draw-loop
        run: supabase functions deploy draw-loop --project-ref $PROJECT_ID

      - name: Deploy sms-webhook
        run: supabase functions deploy sms-webhook --project-ref $PROJECT_ID

      - name: Deploy buy-card
        run: supabase functions deploy buy-card --project-ref $PROJECT_ID

      - name: Deploy register-card
        run: supabase functions deploy register-card --project-ref $PROJECT_ID
