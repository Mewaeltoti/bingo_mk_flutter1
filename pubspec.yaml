name: bingo_mk
description: "Bingo MK – a multiplayer Bingo game."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── Firebase (replaces supabase_flutter + supabase) ──────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  # pubspec.yaml
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0

  # ── State management & utilities ─────────────────────────────────────────
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^8.0.0
  uuid: ^4.5.1

  # ── UI & audio ───────────────────────────────────────────────────────────
  confetti: ^0.8.0
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.2
  marquee: ^2.2.3
  animate_do: ^3.3.4
  google_fonts: ^6.2.1
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/sounds/
  